<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🎲 Dice Game</title>
<style>
  :root {
    --bg: #0f1226;
    --card: #1b1f3b;
    --accent: #6c5ce7;
    --accent2: #00d2a8;
    --danger: #ff5c7c;
    --text: #e8eaf6;
    --muted: #9aa0c3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #2a2f5c 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .app { width: 100%; max-width: 860px; }
  h1 { text-align: center; margin: 0 0 4px; font-size: 28px; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 20px;
  }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.12); background: #12152e; color: var(--text);
    font-size: 14px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row > * { flex: 1; }
  button {
    cursor: pointer; border: none; border-radius: 10px; padding: 11px 14px;
    font-size: 14px; font-weight: 600; color: #fff; transition: transform .06s, opacity .2s;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: var(--accent); }
  .btn-accent { background: var(--accent2); color: #04231d; }
  .btn-ghost { background: rgba(255,255,255,0.08); }
  .btn-danger { background: var(--danger); }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); }
  .dot.on { background: var(--accent2); box-shadow: 0 0 10px var(--accent2); }
  .balance { font-size: 40px; font-weight: 800; margin: 4px 0 0; }
  .balance small { font-size: 16px; color: var(--muted); font-weight: 500; }
  .bet-types { display: flex; gap: 10px; }
  .bet-types button { flex: 1; background: rgba(255,255,255,0.06); border: 2px solid transparent; }
  .bet-types button.active { border-color: var(--accent); background: rgba(108,92,231,0.25); }

  /* Dado */
  .dice-stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .dice {
    width: 90px; height: 90px; border-radius: 16px; background: #fff;
    display: grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr);
    padding: 12px; gap: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .dice .pip { width: 14px; height: 14px; border-radius: 50%; background: #1b1f3b; align-self: center; justify-self: center; visibility: hidden; }
  .dice.rolling { animation: roll .6s ease-in-out; }
  @keyframes roll {
    0% { transform: rotate(0) scale(1); }
    25% { transform: rotate(-90deg) scale(1.1); }
    50% { transform: rotate(90deg) scale(.95); }
    75% { transform: rotate(180deg) scale(1.05); }
    100% { transform: rotate(360deg) scale(1); }
  }
  /* posições dos pips por número */
  .p1{grid-area:1/1} .p2{grid-area:1/2} .p3{grid-area:1/3}
  .p4{grid-area:2/1} .p5{grid-area:2/2} .p6{grid-area:2/3}
  .p7{grid-area:3/1} .p8{grid-area:3/2} .p9{grid-area:3/3}
  .result-badge { font-size: 20px; font-weight: 800; min-height: 26px; }
  .result-badge.win { color: var(--accent2); }
  .result-badge.lose { color: var(--danger); }

  .log { margin-top: 20px; }
  .log-box {
    background: #0c0f22; border-radius: 12px; padding: 12px; height: 180px; overflow-y: auto;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; line-height: 1.6;
  }
  .log-box .in { color: var(--accent2); }
  .log-box .out { color: #8ea0ff; }
  .log-box .err { color: var(--danger); }
  .log-box .sys { color: var(--muted); }
  .mt { margin-top: 14px; }
</style>
</head>
<body>
<div class="app">
  <h1>🎲 Dice Game</h1>
  <p class="sub">Aposte par ou ímpar. Ganhou? Recebe o dobro ao encerrar a jogada.</p>

  <div class="grid">
    <!-- Conexão + carteira -->
    <div class="card">
      <label>Servidor WebSocket</label>
      <div class="row">
        <input id="url" value="ws://localhost:8080/ws" />
      </div>

      <div class="mt">
        <label>Client ID (UUID)</label>
        <div class="row">
          <input id="clientId" />
          <button class="btn-ghost" style="flex:0 0 auto" id="genId" title="Gerar novo UUID">↻</button>
        </div>
      </div>

      <div class="row mt">
        <button class="btn-primary" id="connectBtn">Conectar</button>
        <button class="btn-ghost" id="disconnectBtn" disabled>Desconectar</button>
      </div>

      <div class="mt status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Desconectado</span>
      </div>

      <div class="mt">
        <label>Saldo</label>
        <div class="balance"><span id="balance">—</span> <small>créditos</small></div>
        <button class="btn-ghost mt" id="walletBtn" disabled style="width:100%">Atualizar saldo (wallet)</button>
      </div>
    </div>

    <!-- Jogo -->
    <div class="card">
      <div class="dice-stage">
        <div class="dice" id="dice">
          <span class="pip p1"></span><span class="pip p2"></span><span class="pip p3"></span>
          <span class="pip p4"></span><span class="pip p5"></span><span class="pip p6"></span>
          <span class="pip p7"></span><span class="pip p8"></span><span class="pip p9"></span>
        </div>
        <div class="result-badge" id="resultBadge"></div>
      </div>

      <div class="mt">
        <label>Valor da aposta</label>
        <input id="betAmount" type="number" min="1" value="100" />
      </div>

      <div class="mt">
        <label>Tipo</label>
        <div class="bet-types">
          <button data-type="even" class="active">Par (even)</button>
          <button data-type="odd">Ímpar (odd)</button>
        </div>
      </div>

      <div class="row mt">
        <button class="btn-accent" id="playBtn" disabled>Jogar (play)</button>
        <button class="btn-danger" id="endBtn" disabled>Encerrar (endplay)</button>
      </div>
    </div>
  </div>

  <div class="log card">
    <label>Log de mensagens</label>
    <div class="log-box" id="log"></div>
  </div>
</div>

<script>
  // Mapa de quais pips acender por face (1-6)
  const PIP_MAP = {
    1: [5],
    2: [1, 9],
    3: [1, 5, 9],
    4: [1, 3, 7, 9],
    5: [1, 3, 5, 7, 9],
    6: [1, 3, 4, 6, 7, 9],
  };

  const $ = (id) => document.getElementById(id);
  const els = {
    url: $("url"), clientId: $("clientId"), genId: $("genId"),
    connect: $("connectBtn"), disconnect: $("disconnectBtn"),
    dot: $("statusDot"), status: $("statusText"),
    balance: $("balance"), wallet: $("walletBtn"),
    dice: $("dice"), result: $("resultBadge"),
    betAmount: $("betAmount"), play: $("playBtn"), end: $("endBtn"),
    log: $("log"),
  };

  let ws = null;
  let betType = "even";

  function uuid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
      const r = (Math.random() * 16) | 0;
      return (c === "x" ? r : (r & 0x3) | 0x8).toString(16);
    });
  }

  function log(kind, msg) {
    const line = document.createElement("div");
    line.className = kind;
    const time = new Date().toLocaleTimeString();
    line.textContent = `[${time}] ${msg}`;
    els.log.appendChild(line);
    els.log.scrollTop = els.log.scrollHeight;
  }

  function setConnected(on) {
    els.dot.classList.toggle("on", on);
    els.status.textContent = on ? "Conectado" : "Desconectado";
    els.connect.disabled = on;
    els.disconnect.disabled = !on;
    els.wallet.disabled = !on;
    els.play.disabled = !on;
    els.end.disabled = !on;
  }

  function renderDice(n) {
    const pips = els.dice.querySelectorAll(".pip");
    pips.forEach((p) => (p.style.visibility = "hidden"));
    (PIP_MAP[n] || []).forEach((pos) => {
      const pip = els.dice.querySelector(".p" + pos);
      if (pip) pip.style.visibility = "visible";
    });
  }

  function rollAnimation(finalNumber) {
    els.dice.classList.remove("rolling");
    void els.dice.offsetWidth; // reinicia animação
    els.dice.classList.add("rolling");
    let ticks = 0;
    const interval = setInterval(() => {
      renderDice((Math.floor(Math.random() * 6) + 1));
      if (++ticks > 8) {
        clearInterval(interval);
        renderDice(finalNumber);
      }
    }, 70);
  }

  function send(obj) {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      log("err", "WebSocket não está conectado.");
      return;
    }
    ws.send(JSON.stringify(obj));
    log("out", "↑ " + JSON.stringify(obj));
  }

  function connect() {
    const url = els.url.value.trim();
    try {
      ws = new WebSocket(url);
    } catch (e) {
      log("err", "URL inválida: " + e.message);
      return;
    }
    log("sys", "Conectando em " + url + " ...");

    ws.onopen = () => {
      setConnected(true);
      log("sys", "Conexão aberta.");
      send({ action: "wallet", clientId: els.clientId.value.trim() });
    };

    ws.onmessage = (evt) => {
      log("in", "↓ " + evt.data);
      let data;
      try { data = JSON.parse(evt.data); } catch { return; }
      handleEvent(data);
    };

    ws.onerror = () => log("err", "Erro na conexão WebSocket.");

    ws.onclose = () => {
      setConnected(false);
      log("sys", "Conexão encerrada.");
    };
  }

  function handleEvent(data) {
    switch (data.event) {
      case "wallet":
        els.balance.textContent = data.balance;
        break;
      case "play_result":
        rollAnimation(data.drawnNumber);
        els.result.textContent = data.result === "win" ? "🎉 GANHOU!" : "😞 Perdeu";
        els.result.className = "result-badge " + (data.result === "win" ? "win" : "lose");
        // Atualiza o saldo (a aposta foi debitada no play)
        setTimeout(() => send({ action: "wallet", clientId: els.clientId.value.trim() }), 800);
        break;
      case "play_closed":
        els.balance.textContent = data.balance;
        els.result.textContent = "Jogada encerrada ✔";
        els.result.className = "result-badge";
        break;
      case "error":
        log("err", "⚠ " + (data.message || "erro desconhecido"));
        break;
    }
  }

  // Eventos de UI
  els.genId.onclick = () => (els.clientId.value = uuid());
  els.connect.onclick = connect;
  els.disconnect.onclick = () => ws && ws.close();
  els.wallet.onclick = () => send({ action: "wallet", clientId: els.clientId.value.trim() });
  els.play.onclick = () =>
    send({
      action: "play",
      clientId: els.clientId.value.trim(),
      betAmount: Number(els.betAmount.value),
      type: betType,
    });
  els.end.onclick = () => send({ action: "endplay", clientId: els.clientId.value.trim() });

  document.querySelectorAll(".bet-types button").forEach((b) => {
    b.onclick = () => {
      betType = b.dataset.type;
      document.querySelectorAll(".bet-types button").forEach((x) => x.classList.remove("active"));
      b.classList.add("active");
    };
  });

  // Init
  els.clientId.value = uuid();
  renderDice(1);
</script>
</body>
</html>
